function parse(txt){
  const ok=[],bad=[],seen=new Set;
  const SEP=[/\t/,/\s*;\s*/,/\s+[—–-]+\s+|\s*[—–]\s*/,/\s*\|\s*/,/\s*=\s*/,/:\s+/,/\s*,\s*/,/$/];
  txt.replace(/^\uFEFF/,"").split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim().replace(/^\d+[.)]\s+/,"").replace(/^[•*]\s+/,"");
    if(!l)return;
    let a,b;const q=l.match(/^"([^"]*)"\s*[,;]\s*"?([^"]*?)"?$/);
    if(q){a=q[1].trim();b=q[2].trim()}
    else{const s=SEP.map(r=>l.match(r)).find(Boolean);a=l.slice(0,s.index).trim();b=l.slice(s.index+s[0].length).trim()}
    if(!a||(!b&&l.length>60)){bad.push([i+1,raw,"не распознано"]);return}
    if(!ok.length&&!seen.size&&/^(word|term|слово|english|original|en)$/i.test(a)){seen.add("#h");return}
    const k=a.toLowerCase();
    if(seen.has(k)){bad.push([i+1,raw,"дубликат"]);return}
    seen.add(k);ok.push([a,b]);
  });
  return{ok,bad};
}

async function genSit(){const v=SBX,tk=++v.tk,lv=S.bl||"B1";v.busy="sit";v.hint=0;v.rev=null;v.ans="";rb();
  const r=await callLLM(buildSitPrompt(v.w,lv,v.prev));if(tk!=v.tk)return;
  v.sit=r&&r.text&&r.task?{...r,mock:0}:{...mockSit(v.w,lv,v.n),mock:1};v.n++;v.prev=[...v.prev,v.sit.text].slice(-5);v.busy=0;rb()}
async function chk(){const v=SBX,a=v.ans.trim(),lv=S.bl||"B1";v.busy="chk";rb();
  const r=await callLLM(buildChkPrompt(v.w,lv,v.sit,a));
  v.rev=r&&r.status&&r.note?{...r,status:ns(r.status),my:a,mock:0}:{...mockChk(v.w,a),my:a,mock:1};
  if(v.rev.status=="ok")gain(10,wl(v.w));v.busy=0;rb()}
const hid=async s=>{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,32)};

const lxp=l=>l=="all"?S.xp|0:Object.values(S.hist||{}).reduce((a,h)=>a+(((h.l||{})[l]||{}).xp||0),0);
async function pushBoard(){if(!sbOn())return"";const h=await hid(SB.code),nick=(S.nick||"Игрок").slice(0,24);await Promise.all(["all",...repLangs()].map(l=>rpc("put_board",{p_handle:h,p_lang:l,p_name:nick,p_week:lastDays(7,l).reduce((a,x)=>a+x.xp,0),p_total:lxp(l)})));return h}
async function loadBoard(){const rr=()=>{if(V.v=="board")R()};BRD.busy=1;BRD.err="";rr();try{BRD.me=await pushBoard();BRD.rows=(await rpc("get_board",{p_lang:BRD.l}))||[]}catch(e){BRD.err=syErr(e)}BRD.busy=0;rr()}
const weekRep=l=>{const L=lastDays(7,l),W=l=="all"?S.words:S.words.filter(w=>wl(w)==l),xp=L.reduce((a,x)=>a+x.xp,0),rv=L.reduce((a,x)=>a+x.rv,0),act=L.filter(x=>x.xp||x.rv).length,left=W.reduce((a,w)=>a+Math.max(0,7-w.st),0),mast=W.filter(w=>w.st>=7).length;return{L,W,xp,rv,act,left,mast,days:rv>0?Math.ceil(left/(rv/7)):null}};

const views={
board:()=>{const v=BRD;return`<h2>Рейтинг</h2>`+(!sbOn()?`<div class="card g col"><p>Рейтинг работает через синхронизацию. Подключите Supabase в разделе «Синхронизация».</p><button class="btn" data-a="syn">Открыть синхронизацию</button></div>`:lchips("bdl",v.l)+`<p class="mu">Очки за 7 дней${v.l=="all"?"":" · "+cap(v.l)}. Имя видят все участники рейтинга.</p><input class="in" data-f="nick" value="${esc(S.nick||"")}" placeholder="Ваше имя в рейтинге" maxlength="24"><button class="btn sec" data-a="bdref" ${v.busy?"disabled":""}>${v.busy?"Обновляю…":"Обновить"}</button>`)+(v.err?`<p class="badt">${esc(v.err)}</p>`:"")+(v.rows?(v.rows.length?v.rows.map((r,i)=>`<div class="card ${r.handle==v.me?"tot":""}"><span class="tl" style="background:${i<3?GR[i%4]:"var(--bd)"}">${i+1}</span><div><b class="tt">${esc(r.name)}${r.handle==v.me?" · вы":""}</b><small>${r.week_xp} XP за 7 дней · всего ${r.total_xp}</small></div></div>`).join(""):`<p class="mu">Пока никого нет.</p>`):"")},
rep:()=>{const l=REP.l,r=weekRep(l),mx=Math.max(1,...r.L.map(x=>x.xp));return`<h2>Недельный отчёт</h2>${lchips("rpl",l)}<div class="card tot"><div class="row" style="justify-content:space-around;text-align:center"><div><b class="big2">${r.xp}</b><small class="mu">XP</small></div><div><b class="big2">${r.rv}</b><small class="mu">ответов</small></div><div><b class="big2">${r.act}/7</b><small class="mu">активных дней</small></div></div></div><div class="card g col"><b>XP по дням</b><div style="display:flex;gap:8px;align-items:flex-end;height:130px">${r.L.map(x=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px"><small class="mu">${x.xp||""}</small><div style="width:100%;border-radius:10px;background:linear-gradient(180deg,var(--ac2),var(--ac));height:${Math.max(4,x.xp/mx*80)}px"></div><small class="mu">${["Вс","Пн","Вт","Ср","Чт","Пт","Сб"][x.d.getDay()]}</small></div>`).join("")}</div></div><div class="card g col"><b>Прогноз${l=="all"?"":" · "+cap(l)}</b><p>Освоено полностью: ${r.mast} из ${r.W.length} слов.</p><p>${r.days==null?"Начните заниматься, чтобы увидеть прогноз.":r.left?`При текущем темпе (около ${Math.round(r.rv/7)} ответов в день) слова освоятся ориентировочно через ${r.days} дн.`:"Все слова освоены!"}</p><small class="mu">Оценка грубая: не учитывает интервалы повторения.${l=="all"?"":" Разбивка по языкам ведётся с момента обновления, прошлые дни видны только во вкладке «Всё»."}</small></div>`},
home:()=>S.tab=="read"?views.homeR():S.tab=="ai"?views.homeA():S.tab=="box"?views.homeB():views.homeW(),
homeW:()=>{const d=due().length,tp=pct(S.words);return(S.words.length?`<div class="card tot"><div><b>Общий прогресс: ${tp}%</b><small>до конца ${100-tp}% · курсов: ${S.courses.length} · слов: ${S.words.length}</small><i class="bar"><u style="width:${tp}%"></u></i></div></div>`:"")+(d?`<button class="card due" data-a="review"><b>Пора повторить</b><span>${d} сл.</span></button>`:"")+

  `<div class="card g col"><div class="row" style="justify-content:space-between;align-items:center"><small>Целевое слово</small><button class="x" style="min-height:32px;font-size:14px" data-a="bw">Другое слово</button></div><div class="big2" dir="auto">${esc(w.t)}</div><div class="mu">${esc(w.tr)}</div>${s&&s.gram?`<span class="tag" style="align-self:flex-start">${esc(s.gram)}</span>`:`<i class="sk" style="width:60%"></i>`}</div>`+
  `<div class="card g col"><div class="row" style="justify-content:space-between;align-items:center"><b>Ситуация</b><button class="chip ${ld?"spin":""}" style="flex:none;padding:0 14px" data-a="bsit" ${v.busy?"disabled":""}>${ic("refresh",18)}Сменить ситуацию</button></div>${ld?`<i class="sk"></i><i class="sk" style="width:80%"></i><i class="sk" style="width:60%"></i>`:`<p>${esc(s.text)}</p><p><b>Задача:</b> ${esc(s.task)}</p>${s.mock?`<small class="mu">Демо-режим: ИИ не подключён</small>`:""}`}</div>`+

chat:()=>`<h2>${esc(V.sc)}</h2><div class="kw" id="kw">${kwh()}</div><div id="msgs">${msgs()}</div><div class="comp g"><input class="in" id="cin" data-f="draft" placeholder="Напишите ответ…" autocomplete="off" autocapitalize="off"><button class="send" data-a="snd" aria-label="Отправить">${ic("send",20)}</button></div>`,
sync:()=>{const s=SB||{};return`<h2>Синхронизация</h2><p class="mu">Подключите бесплатный проект Supabase, и прогресс станет общим на всех устройствах. На каждом устройстве введите одни и те же данные.</p><input class="in" data-f="sbu" value="${esc(s.url||"")}" placeholder="Project URL (https://xxxx.supabase.co)" autocapitalize="off" autocomplete="off"><input class="in" data-f="sbk" value="${esc(s.key||"")}" placeholder="anon public key" autocapitalize="off" autocomplete="off"><input class="in" data-f="sbc" value="${esc(s.code||"")}" placeholder="Код синхронизации (не короче 12 символов)" autocapitalize="off" autocomplete="off"><button class="btn sec" data-a="sbgen">Создать новый код</button><button class="btn" data-a="sbok">Подключить и проверить</button><p class="mu" id="sst">${esc(ss||(sbOn()?"Подключено":"Не подключено"))}</p>${sbOn()?`<div class="row"><button class="btn sec" data-a="sbpush">Отправить</button><button class="btn sec" data-a="sbpull">Получить</button></div><button class="btn sec" data-a="sboff">Отключить</button>`:""}<details><summary>SQL для Supabase (выполнить один раз)</summary><pre>${esc(SQL)}</pre></details>`},
done:()=>`<div class="empty">${ic(V.pass?"star":"refresh",48)}<h2>${V.sc}%</h2><p>${V.pass?"Тренировка пройдена!":"Нужно не меньше 80%. Попробуйте ещё раз."}</p><p class="mu">+${T.xp} XP · серия ${S.streak} дн.</p><p class="mu">Освоение слов: ${pct(T.words)}% · до конца ${100-pct(T.words)}%${T.key?` · курс ${prog(S.courses.find(x=>x.id==T.key.c))}%`:""}</p></div><button class="btn" data-a="${T.key?"course":"home"}" data-id="${T.key?T.key.c:""}">Продолжить</button>`
};
function R(){
  $("#app").innerHTML=head()+`<main class="${V.v=="home"||V.v=="chat"?"pb":""}">`+views[V.v]()+"</main>"+(V.v=="home"?tabs():"");
  const t=$("#ty");if(t&&!t.disabled)t.focus();
  $("#pop").className="";
  if(V.v=="chat")scrollTo(0,document.body.scrollHeight);
  if(V.v=="run"){const c=T.q[T.i];if(S.ex&&c&&!c.ex&&!V.ld)ld(c)}
}
function act(a,d,el){
  switch(a){
  case"home":V={v:"home"};T=0;break;
  case"theme":S.theme=S.theme==""?"dark":S.theme=="dark"?"light":"";save();th();break;
  case"tab":S.tab=d.k;save();break;
  case"import":V={v:"import"};break;
  case"sample":$("#paste").value=EX;return;
  case"parse":{const t=$("#paste").value;if(!t.trim())return toast("Вставьте список или выберите файл");return go(t,"Мой курс")}
  case"swap":V.pairs=V.pairs.map(p=>[p[1],p[0]]);break;
  case"del":V.pairs.splice(+d.i,1);break;
  case"tr":return tr();
  case"make":{const id=uid(),ps=V.pairs.filter(p=>p[0].trim()&&p[1].trim());
    S.courses.push({id,title:V.title||"Мой курс",g:GR[S.courses.length%4],per:V.per,done:[],lang:V.clang||"английский"});
    S.words.push(...ps.map((p,i)=>({id:uid(),c:id,l:Math.floor(i/V.per),t:p[0].trim(),tr:p[1].trim(),st:0,due:0})));
    save();V={v:"course",id};break}
  case"course":V={v:"course",id:d.id};break;
  case"lesson":return start(S.words.filter(w=>w.c==V.id&&w.l==+d.i),true,{c:V.id,l:+d.i});
  case"delc":if(!V.cf){V.cf=1;break}S.words=S.words.filter(w=>w.c!=V.id);S.courses=S.courses.filter(c=>c.id!=V.id);save();V={v:"home"};break;
  case"review":return start(due().sort((a,b)=>a.due-b.due).slice(0,10),false,null);
  case"flip":V.flip=!V.flip;break;
  case"mode":S.mode=d.k;save();break;
  case"yes":return grade(true,1);
  case"no":return grade(false,1);
  case"say":return speak(T.q[T.i].t);
  case"pick":if(V.ans!=null)return;V.ans=d.o;return grade(d.o==T.q[T.i].tr);
  case"check":if(V.ans!=null)return;V.ans=$("#ty").value;return grade(same(V.ans,T.q[T.i].t));
  case"next":V.ans=null;V.flip=false;T.i++;if(T.i>=T.q.length)finish();break;
  case"stg":V.sheet=1;break;
  case"shut":V.sheet=0;break;
  case"ex":return ld(T.q[T.i]);
  case"wt":return wt(el,d.x);
  case"sayw":return speak(d.x);
  case"topic":V={v:"read",topic:d.k,txt:null,tt:{},all:0};gen();break;
  case"tsent":V.tt[d.i]=!V.tt[d.i];break;
  case"tall":V.all=!V.all;break;
  case"ssent":return speak(V.txt.s[+d.i].s);
  case"chat":V={v:"chat",sc:d.k,msgs:[],kw:kwList(),used:new Set,busy:0};R();turn();return;
  case"snd":return snd();
  case"rep":V={v:"rep"};break;
  case"lang":S.rl=d.k;save();SBX.w=null;SBX.sit=null;SBX.prev=[];SBX.n=0;SBX.rev=null;SBX.busy=0;SBX.tk++;break;
  case"clang":V.clang=d.k;break;
  case"rpl":REP.l=d.k;break;
  case"bdl":BRD.l=d.k;loadBoard();return;
  case"board":V={v:"board"};loadBoard();break;
  case"bdref":loadBoard();return;
  case"bsit":return genSit();
  case"bw":SBX.w=pickWord();SBX.prev=[];SBX.n=0;return genSit();
  case"bh":SBX.hint=!SBX.hint;break;
  case"bchk":if(!SBX.ans.trim())return toast("Сначала напишите ответ");return chk();
  case"syn":V={v:"sync"};break;
  case"sbgen":{SB=SB||{};const a=new Uint8Array(12);crypto.getRandomValues(a);SB.code=[...a].map(b=>b.toString(36).padStart(2,"0")).join("").slice(0,20);break}
  case"sbok":return connect();
  case"sbpush":S.updated=Date.now();return push();
  case"sbpull":{const u=S.updated;S.updated=0;return pull().then(c=>{if(!c)S.updated=u;R()})}
  case"sboff":SB=null;try{localStorage.removeItem("wf_sb")}catch(e){}ss="";break;
  case"mtr":V.msgs[+d.i].sh=!V.msgs[+d.i].sh;return RC();
  case"msay":return speak(V.msgs[+d.i].s);
  }
  R();
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!e.target.closest("#pop,.wd"))$("#pop").className="";if(t)act(t.dataset.a,t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target,f=t.dataset.f;if(f=="nick"){S.nick=t.value;save();return}if(!f||f=="draft")return;if(f=="bans"){SBX.ans=t.value;return}if(f=="bl"){S.bl=t.value;save();genSit();return}if(f=="sbu"||f=="sbk"||f=="sbc"){SB=SB||{};SB[{sbu:"url",sbk:"key",sbc:"code"}[f]]=t.value.trim();return}if(f=="rl"||f=="lv"){S[f]=t.value;save();return}
  if(f=="title")V.title=t.value;else if(f=="per")V.per=+t.value;else if(f=="lang")V.lang=t.value;else V.pairs[+t.dataset.i][f=="a"?0:1]=t.value});
document.addEventListener("change",e=>{if(e.target.type=="file")load(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key!="Enter")return;if(e.target.id=="ty")act("check",{});else if(e.target.id=="cin")snd()});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();if(V.v=="import")load(e.dataTransfer.files[0])});
th();R();if(sbOn())pull().then(c=>{if(c){th();R()}});
</script>
</body>
</html>
